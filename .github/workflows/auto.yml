name: Cloud Faucet Auto-Farm

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час автоматически
  workflow_dispatch: # Ручная кнопка запустить

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Bot
        run: python bot.py
